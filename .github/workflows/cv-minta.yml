name: CV forrás-minta (egyszeri)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  minta:
    runs-on: ubuntu-latest
    steps:
      - name: Letöltés
        run: |
          mkdir m && cd m
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" -o robots.txt https://www.eleicoes.cv/robots.txt || true
          curl -sSL -A "$UA" -o nacional.html https://www.eleicoes.cv/resultados/nacional || true
          curl -sSL -A "$UA" -o global.html https://www.eleicoes.cv/resultados/global || true
          ls -la; cat robots.txt | head -40
          grep -oE '(src|href)="[^"]+"' nacional.html | sort -u | head -80
          grep -oE '"/[a-zA-Z0-9_/.-]*(api|json|resultados)[^"]*"' nacional.html | sort -u | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: minta
          path: m
          retention-days: 1
